name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests (no hardware required)
        run: python tests/test_scanprobe.py

      - name: Verify single-file script parses
        run: python scanprobe.py --help

      - name: Verify Python syntax
        run: python -m py_compile scanprobe.py tests/test_scanprobe.py

      - name: Verify fixture collector parses
        run: bash -n scripts/collect-fixture.sh
