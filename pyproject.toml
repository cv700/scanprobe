[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashiba-scanprobe"
version = "0.1.0"
description = "Alpha GPU health scanner using nvidia-smi telemetry and Xid kernel-log parsing"
requires-python = ">=3.9"
# Zero mandatory dependencies — runs on any GPU node with Python + nvidia-smi
dependencies = []

[project.scripts]
scanprobe = "ashiba_scanprobe.cli:main_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["ashiba_scanprobe*"]
