[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashiba-scanprobe"
version = "0.1.0"
description = "GPU scan and probe toolkit — passive telemetry + active correctness probes"
requires-python = ">=3.9"
# Zero mandatory dependencies — runs on any GPU node with Python + nvidia-smi
dependencies = []

[project.optional-dependencies]
# pip install ashiba-scanprobe[display]  →  pretty terminal output
display = ["rich>=13"]
# pip install ashiba-scanprobe[probe]    →  matmul correctness + collective latency probes
probe = ["torch>=2.0", "numpy>=1.24"]
# pip install ashiba-scanprobe[full]     →  everything
full = ["rich>=13", "torch>=2.0", "numpy>=1.24"]

[project.scripts]
scanprobe = "ashiba_scanprobe.cli:main_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["ashiba_scanprobe*"]
